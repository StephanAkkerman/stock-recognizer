[project]
name = "stock-recognizer"
dynamic = ["version"]
authors = [{ name="Stephan Akkerman", email="stephan@akkerman.ai" }]
description = "High-precision stock ticker and company recognition for social media."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "financedatabase>=2.2.0",
    "pandas",
    "gliner2",
    "transformers",
    "torch",
    "huggingface_hub"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.urls]
"Homepage" = "https://github.com/StephanAkkerman/stock-recognizer"

# Single source of truth for the version: the package's `_version.py`.
# A release bumps that one literal; this reads it, so the two cannot drift.
[tool.setuptools.dynamic]
version = { attr = "stock_recognizer._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["stock_recognizer*"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
profile = "black"

[tool.ruff]
line-length = 88
#select = ["I001"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "numpy"
